<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#B08A57" />
      <stop offset="100%" stop-color="#8C6239" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9B1AE" />
      <stop offset="60%" stop-color="#A76570" />
      <stop offset="100%" stop-color="#672D39" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#171514" />
  <!-- Elegant D letterform -->
  <path d="M 28 22 L 48 22 C 68 22 78 33 78 50 C 78 67 68 78 48 78 L 28 78 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 38 32 L 48 32 C 60 32 68 39 68 50 C 68 61 60 68 48 68 L 38 68 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6"/>
  <!-- Blooming Rose intertwined in center / curve -->
  <g transform="translate(48, 50) scale(0.65)">
    <!-- Central bud -->
    <path d="M0 -15 C-6 -8 -7 0 0 7 C7 0 6 -8 0 -15 Z" fill="url(#roseGrad)" />
    <!-- Inner petals -->
    <path d="M-4 -9 C-14 -4 -16 6 -8 13 C-2 10 -2 2 -4 -9 Z" fill="url(#roseGrad)" opacity="0.9" />
    <path d="M4 -9 C14 -4 16 6 8 13 C2 10 2 2 4 -9 Z" fill="url(#roseGrad)" opacity="0.9" />
    <!-- Outer blooming petals -->
    <path d="M-12 2 C-20 10 -15 22 -3 22 C-7 15 -8 9 -12 2 Z" fill="url(#roseGrad)" opacity="0.85" />
    <path d="M12 2 C20 10 15 22 3 22 C7 15 8 9 12 2 Z" fill="url(#roseGrad)" opacity="0.85" />
    <!-- Botanical golden stamen/leaf accent -->
    <path d="M0 16 Q -12 24 -18 32 Q -7 28 0 20" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 18 Q 12 24 16 30 Q 7 26 0 20" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
